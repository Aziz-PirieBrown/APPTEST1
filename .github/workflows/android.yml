name: Android CI

# 当你执行 git push 时触发打包任务
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 环境（Android 开发目前主流使用 JDK 17）
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 给 gradlew 脚本添加执行权限（防止权限拒绝报错）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 执行打包命令生成 Debug 版 APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. 上传生成的 APK 文件到 GitHub Actions 页面
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
